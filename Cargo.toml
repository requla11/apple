[package]
name = "apple"
version = "0.1.0"
edition = "2024"
authors = ["Requla Team <dev@requla.org>"]
description = "Hermetic sandbox and process isolation daemon for the Fish build system"
license = "MIT"
repository = "https://github.com/requla11/apple"
readme = "README.md"
keywords = ["sandbox", "hermetic-build", "isolation", "fish", "build-system"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
blake3 = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
